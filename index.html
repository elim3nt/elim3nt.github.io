<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="color-scheme" content="dark">
  <title>Message Master</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0c;
      --panel: #111316;
      --line: #292c31;
      --muted: #858a94;
      --text: #f5f5f3;
      --accent: #e7473f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(231, 71, 63, .09), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: max(28px, env(safe-area-inset-top)) 6.2vw max(22px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      width: min(100%, 1120px);
      margin: 0 auto;
      animation: appear .55s ease-out both;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(231, 71, 63, .38);
      border-radius: 50%;
      background: linear-gradient(145deg, #211719, #111214 72%);
      box-shadow: 0 0 26px rgba(231, 71, 63, .12), inset 0 1px rgba(255,255,255,.06);
    }

    .brand-mark svg { width: 21px; height: 21px; }
    .brand-mark { padding: 0; }
    .brand-mark img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .brand-name { font-size: 15px; font-weight: 650; letter-spacing: -.025em; }
    .brand-name span { color: #aeb1b8; font-weight: 450; }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 64px 0;
    }

    .card {
      position: relative;
      width: min(100%, 490px);
      padding: 34px;
      overflow: hidden;
      border: 1px solid #2b2d32;
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(22,24,28,.98), rgba(14,15,18,.98));
      box-shadow: 0 28px 90px rgba(0,0,0,.48), 0 1px rgba(255,255,255,.035) inset;
      animation: rise .65s cubic-bezier(.2,.75,.25,1) both;
    }

    .card::before {
      position: absolute;
      top: 0;
      left: 34px;
      width: 68px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      content: "";
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: #c4c6cb;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(231,71,63,.72);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 32px);
      font-weight: 640;
      letter-spacing: -.045em;
      line-height: 1.15;
    }

    .intro {
      margin: 12px 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .captcha-slot {
      display: grid;
      min-height: 122px;
      place-items: center;
      width: 100%;
      min-width: 0;
      padding: 18px 10px;
      overflow: hidden;
      border: 1px dashed #41434a;
      border-radius: 15px;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        #0c0d0f;
      background-size: 22px 22px;
      text-align: center;
    }

    .slot-content { display: grid; width: 100%; min-width: 0; justify-items: center; gap: 9px; }
    .slot-icon {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border: 1px solid #34363b;
      border-radius: 11px;
      color: #a5a8af;
      background: #151619;
    }
    .slot-icon svg { width: 17px; height: 17px; }
    .slot-title { color: #d9dade; font-size: 13px; font-weight: 550; }
    .slot-hint { color: #727680; font-size: 12px; }
    .captcha-widget { display: grid; width: 300px; height: 65px; max-width: 100%; min-width: 0; place-items: center; }
    .captcha-status { color: #727680; font-size: 12px; line-height: 1.45; }
    .captcha-status.success { color: #72d39a; }
    .captcha-status.error { color: #ff8d86; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 520px) {
      .shell { padding-right: 20px; padding-left: 20px; }
      main { padding: 48px 0; }
      .card { padding: 27px 23px 23px; border-radius: 21px; }
      .card::before { left: 23px; }
      .captcha-slot { min-height: 108px; padding: 8px 0; }
      .captcha-widget { width: 300px; height: 65px; margin: 0; transform: scale(.86); transform-origin: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar" aria-label="Message Master">
      <div class="brand-mark" aria-hidden="true">
        <img src="logo.jpg" alt="">
      </div>
      <div class="brand-name"><span data-i18n="brand">✉️ Message Master</span></div>
    </header>

    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="eyebrow"><span class="status-dot"></span> <span data-i18n="eyebrow">Quick verification</span></div>
        <h1 id="page-title" data-i18n="title">One small step<br>before you continue</h1>
        <p class="intro" data-i18n="intro">Complete the check below to continue to ✉️ Message Master.</p>

        <div class="captcha-slot" aria-label="Captcha">
          <div class="slot-content">
            <div id="turnstile-widget" class="captcha-widget"></div>
            <div id="captcha-status" class="captcha-status" data-i18n="captchaStatus">Waiting for verification...</div>
          </div>
        </div>

      </section>
    </main>
  </div>
  <script>
    const translations = {
      en: {
        brand: "✉️ Message Master",
        eyebrow: "Quick verification",
        title: "One small step<br>before you continue",
        intro: "Complete the check below to continue to ✉️ Message Master.",
        captchaStatus: "Waiting for verification...",
        captchaSetup: "Add a Cloudflare Turnstile site key to enable verification.",
        captchaPassed: "Verification completed.",
        captchaExpired: "The check expired. Please try again.",
        captchaError: "The check could not be completed. Please try again.",
      },
      ru: {
        brand: "✉️ Message Master",
        eyebrow: "Быстрая проверка",
        title: "Остался один шаг<br>перед продолжением",
        intro: "Пройдите проверку ниже, чтобы продолжить работу с ✉️ Message Master.",
        captchaStatus: "Ожидание проверки...",
        captchaSetup: "Добавьте sitekey Cloudflare Turnstile, чтобы включить проверку.",
        captchaPassed: "Проверка пройдена.",
        captchaExpired: "Срок проверки истёк. Пройдите её ещё раз.",
        captchaError: "Не удалось выполнить проверку. Попробуйте ещё раз.",
      }
    };

    const requestedLanguage = new URLSearchParams(location.search).get("lang");
    const telegramLanguage = window.Telegram?.WebApp?.initDataUnsafe?.user?.language_code;
    const browserLanguage = navigator.language?.split("-")[0];
    const language = requestedLanguage === "ru" ||
      (!requestedLanguage && (telegramLanguage === "ru" || browserLanguage === "ru"))
      ? "ru"
      : "en";
    document.documentElement.lang = language;
    document.querySelectorAll("[data-i18n]").forEach((element) => {
      element.innerHTML = translations[language][element.dataset.i18n];
    });

    // Replace this public key with the sitekey from the Cloudflare Turnstile widget.
    const TURNSTILE_SITE_KEY = "0x4AAAAAAFitw1NZi8WD-fsU";
    const status = document.querySelector("#captcha-status");

    function setCaptchaStatus(key, className = "") {
      status.textContent = translations[language][key];
      status.className = `captcha-status ${className}`;
    }

    function renderTurnstile() {
      if (!window.turnstile) {
        window.setTimeout(renderTurnstile, 100);
        return;
      }
      if (TURNSTILE_SITE_KEY.includes("PASTE_")) {
        setCaptchaStatus("captchaSetup", "error");
        return;
      }
      window.turnstile.render("#turnstile-widget", {
        sitekey: TURNSTILE_SITE_KEY,
        size: "normal",
        callback: (token) => {
          setCaptchaStatus("captchaPassed", "success");
          if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.sendData(JSON.stringify({ turnstileToken: token }));
          }
        },
        "expired-callback": () => setCaptchaStatus("captchaExpired", "error"),
        "error-callback": () => setCaptchaStatus("captchaError", "error"),
      });
    }

    renderTurnstile();
  </script>
</body>
</html>
